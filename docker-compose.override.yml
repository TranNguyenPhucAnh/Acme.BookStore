services:
  acme.bookstore.httpapi.host:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=6f58d05d-6b02-45f2-b5ed-320a4834901c
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - ./src/Acme.BookStore.HttpApi.Host/openiddict.pfx:/https/aspnetapp.pfx:ro
    networks:
      - net
  angular:
    environment:
      - NODE_ENV=production
    ports:
      - "4200:80"
    volumes:
      - ./angular/dynamic-env.json:/usr/share/nginx/html/dynamic-env.json
    depends_on:
      - acme.bookstore.httpapi.host
    networks:
      - net
  db-migrator:
    environment:
      - OpenIddict__Applications__BookStore_App__RootUrl=http://localhost:4200
      - OpenIddict__Applications__BookStore_Swagger__RootUrl=https://localhost:8081
      - ConnectionStrings__Default=Server=mysql;Port=3306;Database=BookStore;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - net
  mysql:
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=BookStore
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - net
  jenkins:
    ports:
      - "8082:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    networks:
      - net
volumes:
  mysql_data:
  jenkins_home:
networks:
    net: