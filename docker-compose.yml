      context: .
      dockerfile: src/Acme.BookStore.HttpApi.Host/Dockerfile
  angular:
    container_name: bookstore-frontend
    image: ${DOCKER_REGISTRY-}frontend
    build:
      context: ./angular
      dockerfile: Dockerfile.local
      