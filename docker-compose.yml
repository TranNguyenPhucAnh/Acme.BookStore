services:
  dotnet:
    container_name: bookstore-backend
    image: backend
    build:
      context: .
      dockerfile: src/Acme.BookStore.HttpApi.Host/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - cloudflare-net
  angular:
    container_name: bookstore-frontend
    image: frontend
    build:
      context: ./angular
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    volumes:
        - ./angular/dynamic-env.json:/usr/share/nginx/html/dynamic-env.json
        - /var/lib/docker/volumes/jenkins_home/_data/workspace/frontend/angular/dist/BookStore:/usr/share/nginx/html
    depends_on:
      - dotnet
    networks:
      - cloudflare-net
  db-migrator:
    image: acme/bookstore-db-migrator:latest
    container_name: db-migrator
    build:
      context: .
      dockerfile: src/Acme.BookStore.DbMigrator/Dockerfile.local
    environment:
      - OpenIddict__Applications__BookStore_App__RootUrl=https://bookstore-demo.online
      - OpenIddict__Applications__BookStore_Swagger__RootUrl=https://bookstore-demo.online/swagger
      - ConnectionStrings__Default=Server=mysql;Port=3306;Database=BookStore;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - cloudflare-net
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=BookStore
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cloudflare-net
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_server
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    ports:
      - "8082:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudflare-net
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /Users/phucanhtrannguyen/Downloads/bookstore-demo.online.cer:/etc/nginx/certs/bookstore-demo.online.cer:ro
      - /Users/phucanhtrannguyen/Downloads/bookstore-demo.online.key:/etc/nginx/certs/bookstore-demo.online.key:ro
      - /Users/phucanhtrannguyen/Downloads/default.conf:/etc/nginx/conf.d/default.conf
      - /var/lib/docker/volumes/jenkins_home/_data/workspace/frontend/angular/dist/BookStore:/usr/share/nginx/html
    networks:
      - cloudflare-net
volumes:
  mysql_data:
    name: mysql_data
  jenkins_home:
    name: jenkins_home
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true