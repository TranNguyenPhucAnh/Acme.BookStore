name: Build Angular and Deploy to S3

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Branch to build'
        required: true
        default: 'aws'
        
  repository_dispatch: # Bổ sung: Cho phép gọi từ workflow khác (Init)
    types: [deploy_frontend]

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: bookstore-demo
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable corepack and setup Yarn
        run: corepack enable yarn

      - name: Install dependencies & build
        working-directory: ./angular
        run: |
          yarn install
          yarn build:prod
          cp dynamic-env.json dist/BookStore/getEnvConfig

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Get S3 Bucket name from CloudFormation Output
        id: s3bucket
        run: |
          BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{env.PROJECT_NAME}}-FrontendBucketName'].Value" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 sync angular/dist/BookStore s3://$BUCKET_NAME --delete
          aws s3 cp ./angular/dist/BookStore/getEnvConfig s3://$BUCKET_NAME/getEnvConfig \
                --content-type application/json \
                --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          # Lấy distribution id, ví dụ từ output CloudFormation nếu có step trước
          DISTRIBUTION_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.PROJECT_NAME }}-CloudFrontDistributionId'].Value" \
            --output text --region ${{ env.AWS_REGION }})
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "ERROR: CloudFront DistributionId is empty!"; exit 1;
          fi
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
               
      - name: Success Notification
        if: success()
        run: echo "Build & Upload succeeded!"

      - name: Failure Notification
        if: failure()
        run: echo "Build or Upload failed!"
