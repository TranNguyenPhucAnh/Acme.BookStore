name: Build Angular and Deploy to S3

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Branch to build'
        required: true
        default: 'aws'
  repository_dispatch: # Bổ sung: Cho phép gọi từ workflow khác (Init)
    types: [deploy_frontend]
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable corepack and setup Yarn
        run: corepack enable yarn

      - name: Install dependencies & build
        working-directory: ./angular
        run: |
          yarn install
          yarn build:prod
          cp dynamic-env.json dist/BookStore/getEnvConfig

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
          
      - name: Get S3 Bucket name from CloudFormation Output
        id: s3bucket
        run: |
          BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='bookstore-demo-FrontendBucketName'].Value" \
            --output text \
            --region ap-southeast-1)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 sync angular/dist/BookStore s3://$BUCKET_NAME --delete
          aws s3 cp ./angular/dist/BookStore/getEnvConfig s3://$BUCKET_NAME/getEnvConfig \
                --content-type application/json \
                --metadata-directive REPLACE
                
      - name: Success Notification
        if: success()
        run: echo "Build & Upload succeeded!"

      - name: Failure Notification
        if: failure()
        run: echo "Build or Upload failed!"
