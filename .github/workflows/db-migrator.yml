name: Run DB Migration on ECS

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Branch for migration'
        required: true
        default: 'aws'

  repository_dispatch: # Bổ sung: Cho phép gọi từ workflow khác (Init)
    types: [deploy_migration]

jobs:
  run-migration:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      PROJECT_NAME: bookstore-demo
      DB_MIGRATOR_TASK_DEF: db-migrator-task-def.json
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get branch name (sanitize for Docker tag)
        id: branch
        shell: bash
        run: |
          RAW_BRANCH="${{ github.event.inputs.git_branch || github.ref_name }}" # Lấy từ input hoặc ref_name
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '/' '-' | tr -cd '[:alnum:]._-')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> $GITHUB_ENV
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Dynamic Infrastructure Parameters (from CFN Exports)
        id: cfn-params
        run: |      
          # Endpoint, port, role từ CloudFormation exports
          TASK_DEF="${{env.PROJECT_NAME}}-DbMigrator-TaskDef"
          DB_ENDPOINT=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-DBEndpointAddress'].Value" --output text --region ${{ env.AWS_REGION }})
          DB_PORT=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-DBEndpointPort'].Value" --output text --region ${{ env.AWS_REGION }})
          TASK_EXECUTION_ROLE_ARN=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-ECSTaskExecutionRoleArn'].Value" --output text --region ${{ env.AWS_REGION }})
          ECS_CLUSTER_ARN=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-ECSClusterArn'].Value" --output text --region ${{ env.AWS_REGION }})
          MIGRATOR_SG_ID=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-ECSDbMigratorSGId'].Value" --output text --region ${{ env.AWS_REGION }})
          SUBNET_IDS=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-PrivateSubnetIds'].Value" --output text --region ${{ env.AWS_REGION }})
          ECR_REPOSITORY_NAME=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-MainECRRepositoryName'].Value" --output text --region ${{ env.AWS_REGION }})  
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME"

          # Lưu vào môi trường cho các bước sau
          echo "TASK_DEF=$TASK_DEF" >> $GITHUB_ENV
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "DB_USER=admin" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.MYSQL_BOOKSTORE_DB_PASSWORD }}" >> $GITHUB_ENV
          echo "IMAGE_URI=$ECR_URI:${{ env.BRANCH_NAME }}" >> $GITHUB_ENV
          echo "TASK_EXECUTION_ROLE_ARN=$TASK_EXECUTION_ROLE_ARN" >> $GITHUB_ENV
          echo "ECS_CLUSTER_ARN=$ECS_CLUSTER_ARN" >> $GITHUB_ENV
          echo "SECURITY_GROUP_ID=$MIGRATOR_SG_ID" >> $GITHUB_ENV
          echo "SUBNET_IDS=$SUBNET_IDS" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY_NAME" >> $GITHUB_ENV
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV

      - name: Render ECS task definition
        run: |
          cat db-migrator-task-def.json | \
            sed "s|\${TASK_DEF}|${TASK_DEF}|g" | 
            sed "s|\${DB_ENDPOINT}|${DB_ENDPOINT}|g" | \
            sed "s|\${DB_PORT}|${DB_PORT}|g" | \
            sed "s|\${DB_USER}|${DB_USER}|g" | \
            sed "s|\${DB_PASSWORD}|${DB_PASSWORD}|g" | \
            sed "s|\${IMAGE_URI}|${IMAGE_URI}|g" | \
            sed "s|\${TASK_EXECUTION_ROLE_ARN}|${TASK_EXECUTION_ROLE_ARN}|g" \
            > db-migrator-task-def.rendered.json

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build DB Migrator Docker image
        # Giả định context là thư mục gốc và Dockerfile nằm ở đường dẫn tương ứng
        run: docker build -f src/Acme.BookStore.DbMigrator/Dockerfile.local -t ${{ env.ECR_URI }}:${{ env.BRANCH_NAME }} .

      - name: Push migration image to ECR
        run: docker push ${{ env.ECR_URI }}:${{ env.BRANCH_NAME }}

      - name: Update migrator task definition (set image)
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.DB_MIGRATOR_TASK_DEF }}
          container-name: db-migrator
          # Sử dụng Image URI với tag của branch hiện tại
          image: ${{ env.ECR_URI }}:${{ env.BRANCH_NAME }}
          
      - name: Register ECS task definition
        id: register-task
        run: |
          TASKDEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://db-migrator-task-def.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASKDEF_ARN=$TASKDEF_ARN" >> $GITHUB_ENV
          
      - name: Run migration ECS task
        run: |
          # Chuyển chuỗi Subnets (subnet-x,subnet-y) thành mảng JSON ([ "subnet-x", "subnet-y" ])
          SUBNETS_ARRAY=$(echo "${{ env.SUBNET_IDS }}" | tr ',' '\n' | jq -R . | jq -s .)
          
          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER_ARN }} \
            --launch-type FARGATE \
            --task-definition ${{ env.TASKDEF_ARN }} \
            --network-configuration "awsvpcConfiguration={subnets=$SUBNETS_ARRAY,securityGroups=[\"${{ env.SECURITY_GROUP_ID }}\"],assignPublicIp=\"DISABLED\"}"
            
      - name: Check migration status
        run: echo "Migration ECS task launched. Check ECS console or use 'aws ecs describe-tasks' for status."
