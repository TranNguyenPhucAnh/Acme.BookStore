name: Build and Deploy to ECS Fargate

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Branch to build'
        required: true
        default: 'aws'
        
  repository_dispatch:
    types: [deploy_dotnet]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      PROJECT_NAME: bookstore-demo
      DOTNET_TASK_DEF: ecs-task-def.json
      RENDERED_DOTNET_TASK_DEF: ecs-task-def.rendered.json
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch name (sanitize for Docker tag)
        id: branch
        shell: bash
        run: |
          RAW_BRANCH="${GITHUB_REF##*/}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '/' '-' | tr -cd '[:alnum:]._-')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Dynamic Infrastructure Parameters (from CFN Exports)
        run: |
          TASK_DEF="${{ env.PROJECT_NAME }}-DotnetTaskDefArn"
          DB_ENDPOINT=$(aws cloudformation list-exports --query "Exports[?Name=='${{ env.PROJECT_NAME }}-DBEndpointAddress'].Value" --output text --region ${{ env.AWS_REGION }})
          DB_PORT=$(aws cloudformation list-exports --query "Exports[?Name=='${{ env.PROJECT_NAME }}-DBEndpointPort'].Value" --output text --region ${{ env.AWS_REGION }})
          TASK_ROLE_ARN=$(aws cloudformation list-exports --query "Exports[?Name=='${{ env.PROJECT_NAME }}-ECSTaskToReadBookStoreSecretsRoleArn'].Value" --output text --region ${{ env.AWS_REGION }})
          TASK_EXECUTION_ROLE_ARN=$(aws cloudformation list-exports --query "Exports[?Name=='${{ env.PROJECT_NAME }}-ECSTaskExecutionRoleArn'].Value" --output text --region ${{ env.AWS_REGION }})
          ECR_REPOSITORY_NAME=$(aws cloudformation list-exports --query "Exports[?Name=='${{ env.PROJECT_NAME }}-MainECRRepositoryName'].Value" --output text --region ${{ env.AWS_REGION }})
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME"
          ECS_SERVICE="${{ env.PROJECT_NAME }}-Dotnet-Service"
          ECS_CLUSTER="${{ env.PROJECT_NAME }}-ECSCluster"

          echo "TASK_DEF=$TASK_DEF" >> $GITHUB_ENV
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "DB_USER=admin" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.MYSQL_BOOKSTORE_DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TASK_ROLE_ARN=$TASK_ROLE_ARN" >> $GITHUB_ENV
          echo "TASK_EXECUTION_ROLE_ARN=$TASK_EXECUTION_ROLE_ARN" >> $GITHUB_ENV
          echo "IMAGE_URI=$ECR_URI:dotnet-${{ github.ref_name }}" >> $GITHUB_ENV
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "ECS_SERVICE=$ECS_SERVICE" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$ECS_CLUSTER" >> $GITHUB_ENV

      - name: Render ECS task definition
        run: |
          cp ${{ env.DOTNET_TASK_DEF }} ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${TASK_DEF}|${TASK_DEF}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${DB_ENDPOINT}|${DB_ENDPOINT}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${DB_PORT}|${DB_PORT}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${DB_USER}|${DB_USER}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${DB_PASSWORD}|${DB_PASSWORD}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${IMAGE_URI}|${IMAGE_URI}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${TASK_ROLE_ARN}|${TASK_ROLE_ARN}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}
          sed -i "s|\${TASK_EXECUTION_ROLE_ARN}|${TASK_EXECUTION_ROLE_ARN}|g" ${{ env.RENDERED_DOTNET_TASK_DEF }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: docker build -f src/Acme.BookStore.HttpApi.Host/Dockerfile -t ${{ env.ECR_URI }}:dotnet-${{ env.BRANCH_NAME }} .

      - name: Push image to Amazon ECR
        run: docker push ${{ env.ECR_URI }}:dotnet-${{ env.BRANCH_NAME }}

      - name: Fill in new image in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.RENDERED_DOTNET_TASK_DEF }}
          container-name: dotnet
          image: ${{ env.ECR_URI }}:dotnet-${{ env.BRANCH_NAME }}

      - name: Deploy ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
