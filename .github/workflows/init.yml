name: Infrastructure and Application Initialization

on:
  workflow_dispatch: # Giữ lại: Cho phép chạy thủ công (Phát triển)
    inputs:
      git_branch:
        description: 'Branch for migration'
        required: true
        default: 'aws'

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: bookstore-demo
  VPCCIDR: 10.0.0.0/16
  FCK_NAT_AMI_ID: ami-02a52449447725fc8 #arm64
  NAT_INSTANCE_TYPE: t4g.nano
  APP_DOMAIN: bookstore-demo.online
  CLOUDFRONT_HOSTED_ZONE_ID: Z2FDTNDATAQYW2
  DB_USERNAME: admin
  APP_PORT: 8080
  MYSQL_PORT: 3306
  CFN_MODULES_PATH: ./cloudformation/

jobs:
  # =======================================================
  # JOB 1: INFRA-SETUP (Tạo Network, Security, Database, Compute/ECR, ALB/CF)
  # =======================================================
  infra-setup:
    runs-on: ubuntu-latest
    outputs:
      db_instance_identifier: ${{ steps.get-db-ins-id.outputs.db_instance_identifier }}
      ecr_repo_uri: ${{ steps.get-compute-outputs.outputs.ecr_repo_uri }}
      ecs_cluster_name: ${{ steps.get-compute-outputs.outputs.ecs_cluster_name }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 0a. Deploy ROUTE53 + ALB CERT Stack (ap-southeast-1)
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/route53-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Route53-Stack \
            --region ap-southeast-1 \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                AppDomain=${{ env.APP_DOMAIN }} \
            --capabilities CAPABILITY_IAM
      
          HOSTED_ZONE_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Route53-Stack \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-HostedZoneId'].OutputValue" \
            --output text)
      
          ALB_CERT_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Route53-Stack \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-ALBCertArn'].OutputValue" \
            --output text)
      
          echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> $GITHUB_ENV
          echo "ALB_CERT_ARN=$ALB_CERT_ARN" >> $GITHUB_ENV
      
      - name: 0b. Deploy CLOUDFRONT CERT Stack (us-east-1)
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/cloudfront-cert-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-CloudFrontCert-Stack \
            --region us-east-1 \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                AppDomain=${{ env.APP_DOMAIN }} \
                HostedZoneId=${{ env.HOSTED_ZONE_ID }} \
            --capabilities CAPABILITY_IAM
      
          CLOUDFRONT_CERT_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-CloudFrontCert-Stack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-CloudFrontCertArn'].OutputValue" \
            --output text)
      
          echo "CLOUDFRONT_CERT_ARN=$CLOUDFRONT_CERT_ARN" >> $GITHUB_ENV

      - name: 0c. Deploy SECRETS Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/secrets-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Secrets-Stack \
            --region ap-southeast-1 \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                SignCertB64=${{ secrets.SIGN_PFX_B64 }} \
                EncCertB64=${{ secrets.ENC_PFX_B64 }} \
            --capabilities CAPABILITY_IAM
      
          SIGN_CERT_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Secrets-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-SignCertSecretArn'].OutputValue" \
            --output text)
      
          ENC_CERT_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Secrets-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-EncCertSecretArn'].OutputValue" \
            --output text)
      
          echo "SIGN_CERT_SECRET_ARN=$SIGN_CERT_SECRET_ARN" >> $GITHUB_ENV
          echo "ENCRYPT_CERT_SECRET_ARN=$ENC_CERT_SECRET_ARN" >> $GITHUB_ENV
      
      - name: 1. Deploy NETWORK Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/network-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Network-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                VPCCIDR=${{ env.VPCCIDR }} \
                FckNatAmiId=${{ env.FCK_NAT_AMI_ID }} \
                InstanceType=${{ env.NAT_INSTANCE_TYPE }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM 
            
          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Network-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-VPCId'].OutputValue" \
            --output text)
            
            echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV # Lưu VPC_ID vào môi trường

      - name: 2. Deploy SECURITY Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/security-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Security-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                VPCId=${{ env.VPC_ID }} \
                AppPort=${{ env.APP_PORT }} \
                MysqlPort=${{ env.MYSQL_PORT }} \
                SigningCertificateSecretArn=${{ env.SIGN_CERT_SECRET_ARN }} \
                EncryptionCertificateSecretArn=${{ env.ENCRYPT_CERT_SECRET_ARN }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM 
            
      - name: 3. Deploy DATABASE Stack
        id: get-db-ins-id
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/database-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Database-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                DBUsername=${{ env.DB_USERNAME }} \
                DBPassword=${{ secrets.MYSQL_BOOKSTORE_DB_PASSWORD }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM

          DB_INSTANCE_IDENTIFIER=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Database-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-DBInstanceIdentifier'].OutputValue" \
            --output text)

          echo "db_instance_identifier=$DB_INSTANCE_IDENTIFIER" >> $GITHUB_OUTPUT

      - name: 4. Deploy COMPUTE Stack (Tạo ECR/Cluster/TaskDefs)
        id: get-compute-outputs
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/compute-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Compute-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                AppPort=${{ env.APP_PORT }} \
                DBUsername=${{ env.DB_USERNAME }} \
                DBPassword=${{ secrets.MYSQL_BOOKSTORE_DB_PASSWORD }} \
                BranchName=${{ github.ref_name }} \
                CertPassphrase=${{ secrets.CERT_PASSPHRASE }} \
                SignCertPassword=${{ secrets.SIGN_CERT_PASSWORD }} \
                EncCertPassword=${{ secrets.ENC_CERT_PASSWORD }} \
                StringEncryptionKey=${{ secrets.STRING_ENCRYPTION_KEY }} \
                SmtpPassword=${{ secrets.SMTP_PASSWORD }} \
                AwsAccessKey=${{ secrets.AWS_ACCESS_KEY_ID }} \
                AwsSecretKey=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
            
          ECR_REPO_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Compute-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-MainECRRepositoryName'].OutputValue" \
            --output text)
            
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPO_NAME"

          ECS_CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Compute-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-ECSClusterName'].OutputValue" \
            --output text)

          echo "ecr_repo_uri=$ECR_URI" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$ECS_CLUSTER_NAME" >> $GITHUB_OUTPUT

      - name: 5. Deploy LOAD BALANCER / CLOUDFRONT Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/alb-cf-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-LoadBalancer-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                AppDomain=${{ env.APP_DOMAIN }} \
                AppPort=${{ env.APP_PORT }} \
                HostedZoneId=${{ env.HOSTED_ZONE_ID }} \
                CloudfrontHostedZoneId=${{ env.CLOUDFRONT_HOSTED_ZONE_ID }} \
                ALBCertificateArn=${{ env.ALB_CERT_ARN }} \
                CloudFrontCertificateArn=${{ env.CLOUDFRONT_CERT_ARN }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM 

  # =======================================================
  # JOB 2: BUILD & PUSH IMAGES & ANGULAR OUTPUT
  # =======================================================
  build-push:
    needs: infra-setup

    permissions:
      contents: write    # cần thiết để được phép gửi repository_dispatch event
      actions: write     # tùy optional, nhưng khuyến nghị thêm
      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Trigger DB Migration Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy_migration
          client-payload: '{ "ref": "${{ github.ref }}", "sha": "${{ github.sha }}" }'

      - name: Trigger Angular Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy_frontend
          client-payload: '{ "ref": "${{ github.ref }}", "sha": "${{ github.sha }}" }'

      - name: Set ECR URL and Image URI
        id: ecr
        run: |
          ECR_URI="${{ needs.infra-setup.outputs.ecr_repo_uri }}"
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "DOTNET_IMAGE_URI=$ECR_URI:dotnet-${{ github.ref_name }}" >> $GITHUB_ENV
          
      - name: Login to Amazon ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ECR_URI }}
          username: AWS
          # Lấy token login từ ECR
          password: ${{ steps.ecr.outputs.token }}

      - name: Build and Push Dotnet Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Acme.BookStore.HttpApi.Host/Dockerfile
          push: true
          tags: ${{ env.DOTNET_IMAGE_URI }}
          platforms: linux/amd64
          no-cache: true
          # Thêm cache nếu cần (type=gha)
          
      - name: 6. Deploy ECS SERVICE Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/service-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Service-Stack \
            --parameter-overrides \
                ProjectName=${{ env.PROJECT_NAME }} \
                AppPort=${{ env.APP_PORT }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM

          ECS_SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-Service-Stack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.PROJECT_NAME }}-DotnetServiceName'].OutputValue" \
            --output text)

          echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME" >> $GITHUB_ENV
            
      - name: 7. Deploy AUTOMATION Stack
        run: |
          DB_INSTANCE_IDENTIFIER="${{ needs.infra-setup.outputs.db_instance_identifier }}"
          ECS_CLUSTER_NAME="${{ needs.infra-setup.outputs.ecs_cluster_name }}"

          echo "DB_INSTANCE_IDENTIFIER=$DB_INSTANCE_IDENTIFIER" >> $GITHUB_ENV
          echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME" >> $GITHUB_ENV

          aws cloudformation deploy \
            --template-file ${{ env.CFN_MODULES_PATH }}/automation-stack.yml \
            --stack-name ${{ env.PROJECT_NAME }}-Automation-Stack \
            --parameter-overrides \
                DBInstanceIdentifier=${{ env.DB_INSTANCE_IDENTIFIER }} \
                ECSClusterName=${{ env.ECS_CLUSTER_NAME }} \
                ECSServiceName=${{ env.ECS_SERVICE_NAME }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
