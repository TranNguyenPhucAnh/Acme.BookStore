name: Rollback AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'Branch to rollback'
        required: true
        default: 'aws'

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: bookstore-demo

jobs:
  rollback-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Dynamic Infrastructure Parameters (from CFN Exports)
        run: |
          ECR_REPO_NAME=$(aws cloudformation list-exports --query "Exports[?Name=='${{env.PROJECT_NAME}}-MainECRRepositoryName'].Value" --output text --region ${{ env.AWS_REGION }})  
          echo "ECR_REPO_NAME=$ECR_REPO_NAME" >> $GITHUB_ENV

      - name: Cleanup ECR images before stack deletion
        run: |
          REPO="${{ env.ECR_REPO_NAME }}"
          IMAGE_IDS=$(aws ecr list-images --repository-name $REPO --region ${{ env.AWS_REGION }} --query 'imageIds[*]' --output json)
          if [ "$IMAGE_IDS" != "[]" ]; then
            aws ecr batch-delete-image --repository-name $REPO --region ${{ env.AWS_REGION }} --image-ids "$IMAGE_IDS"
            echo "Deleted all images in ECR repo $REPO"
          else
            echo "ECR repo $REPO is already empty"
          fi

      - name: Get S3 Bucket name from CFN output
        id: get-s3-bucket
        run: |
          BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{env.PROJECT_NAME}}-FrontendBucketName'].Value" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      
      - name: Empty S3 Bucket before stack deletion
        run: |
          aws s3 rm s3://$BUCKET_NAME --recursive
          echo "Emptied S3 bucket $BUCKET_NAME"

      # Delete Automation Stack
      - name: Delete Automation Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Automation-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Automation-Stack

      # Delete ECS Service Stack
      - name: Delete ECS Service Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Service-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Service-Stack

      # Delete Load Balancer / CloudFront Stack
      - name: Delete LoadBalancer / CloudFront Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-LoadBalancer-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-LoadBalancer-Stack

      # Delete Compute (ECR/Cluster/TaskDef) Stack
      - name: Delete Compute Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Compute-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Compute-Stack

      # Delete Database Stack
      - name: Delete Database Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Database-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Database-Stack

      # Delete Security Stack
      - name: Delete Security Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Security-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Security-Stack

      # Delete Network Stack
      - name: Delete Network Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}-Network-Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}-Network-Stack

      # Optionally: Check/delete orphaned resources (S3 bucket, logs, etc)
      # - name: Cleanup orphan S3 buckets/log groups if needed
      #   run: aws s3api delete-bucket ... / aws logs delete-log-group ...
