<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Schedulers' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'BookStore.Schedulers.Create'" id="create" class="btn btn-primary" type="button" (click)="createScheduler()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewSchedule' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable
    [rows]="schedulers.items"
    [count]="schedulers.totalCount"
    [list]="list"
    [limit]="list.maxResultCount"
    default>
    @if (isEditAndDelete()) {
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'BookStore.Schedulers.Edit'" ngbDropdownItem (click)="editScheduler(row.id)">
                {{ '::Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'BookStore.Schedulers.Delete'" ngbDropdownItem (click)="delete(row.id)">
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
    }

      <ngx-datatable-column [name]="'::RecipientEntity' | abpLocalization" prop="recipientEntity">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.recipientEntity }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Description' | abpLocalization" prop="description">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.description }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::CronExpression' | abpLocalization" prop="cronExpression">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.cronExpression }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::RecipientType' | abpLocalization" prop="recipientType">
        <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:RecipientType' + row.recipientType | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Output' | abpLocalization" prop="workerOutputType">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ '::Enum:WorkerOutputType' + row.workerOutputType | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

    </ngx-datatable>

    <div class="page-size-selector">
      <label for="page-size-select"></label>
      <select id="page-size-select" (change)="onPageSizeChange($event.target.value)">
        @for (size of pageSizes; track $index) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </div>

  </div>
</div>
