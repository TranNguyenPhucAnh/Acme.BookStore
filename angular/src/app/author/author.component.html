<div class="card">
  <div class="card-header">
    <div class="row">
      <h5 class="card-title">
        {{ '::Menu:Authors' | abpLocalization }}
        <p *appFeature="'BookStore.Authors.Enable'">(You can show/hide this text in the Feature Management tab)</p>
      </h5>
      <div class="col col-md-8">
        <div class="row">
          <div class="col col-md-3">
            <div class="form-group">
              <input
                type="text"
                name="search"
                class="form-control filter-field"
                placeholder="Find an author here..."
                [(ngModel)]="list.filter"
                (ngModelChange)="list.get()"/>
            </div>
          </div>

          <div class="col col-md-3">
            <div class="form-group">
              <label for="from">From</label>
              <input
                id="from"
                class="form-control"
                name="fromDate"
                [minDate]="dates.min"
                [maxDate]="dates.max"
                [readOnly]="true"
                (click)="fromPicker.toggle()"
                (navigate)="onNavigate($event, 'from')"
                (closed)="onClosed()"
                [(ngModel)]="dates.from"
                (ngModelChange)="list.get()"
                #fromPicker="ngbDatepicker"
                ngbDatepicker
              />
            </div>
          </div>  

          <div class="col col-md-3">
            <div class="form-group">
              <label for="to">To</label>
              <input
                id="to"
                name="toDate"
                #toPicker="ngbDatepicker"
                class="form-control"
                [minDate]="dates.min"
                [maxDate]="dates.max"
                (navigate)="onNavigate($event, 'to')"
                (closed)="onClosed()"
                [(ngModel)]="dates.to"
                (ngModelChange)="list.get()"
                ngbDatepicker
                [readOnly]="true"
                (click)="toPicker.toggle()"
              />
            </div>
          </div>

        </div>
      </div>

      <div class="text-end col col-md-4">
        <div class="text-lg-end pt-3">
          <button *abpPermission="'BookStore.Authors.Create'" id="create" class="btn btn-primary" type="button" (click)="createAuthor()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewAuthor' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable
    [rows]="author.items"
    [count]="author.totalCount"
    [list]="list"
    [limit]="list.maxResultCount"
    default>
    @if (isEditAndDelete()) {
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'BookStore.Authors.Edit'" ngbDropdownItem (click)="editAuthor(row.id)">
                {{ '::Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'BookStore.Authors.Delete'" ngbDropdownItem (click)="delete(row.id)">
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
    }
      
      <ngx-datatable-column [name]="'::BirthDate' | abpLocalization">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.birthDate | date }}
        </ng-template>
      </ngx-datatable-column>
      
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>

    </ngx-datatable>
    <div class="page-size-selector"> 
      <label for="page-size-select"></label>
      <select id="page-size-select" (change)="onPageSizeChange($event.target.value)">
      @for (size of pageSizes; track $index) {
        <option [value]="size">{{ size }}</option>
      }
      </select>
    </div>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedAuthor.id ? '::Edit' : '::NewAuthor') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="author-name">Name</label><span> * </span>
        <input type="text" id="author-name" class="form-control" formControlName="name" autofocus />
      </div>

      <div class="mt-2">
        <label>Birth date</label><span> * </span>
        <input
          #datepicker="ngbDatepicker"
          class="form-control"
          name="datepicker"
          formControlName="birthDate"
          ngbDatepicker
          (click)="datepicker.toggle()"
        />
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>

    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
